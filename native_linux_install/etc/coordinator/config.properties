# Bu node coordinator olarak calisir.
coordinator=true

# Coordinator sadece planlama/scheduling yapsin, worker gibi query task almasin.
node-scheduler.include-coordinator=false

# HTTP port. HTTPS aktif edilirse 8443 de eklenebilir.
http-server.http.port=8080

# Buraya coordinator'in kendi erisilebilir adresi yazilir.
# Script bu placeholder'i env dosyasindaki TRINO_COORDINATOR_URI ile doldurur.
discovery.uri={{TRINO_COORDINATOR_URI}}

# 3 worker * 40GB = 120GB cluster-level query memory.
query.max-memory=120GB
query.max-memory-per-node=40GB

# Coordinator heap 24G oldugu icin OS/JVM headroom birakiyoruz.
memory.heap-headroom-per-node=4GB

# HTTPS aktif edilecekse security ekibiyle sertifika/keystore netlestirildikten
# sonra asagidaki satirlar acilir.
# http-server.https.enabled=true
# http-server.https.port=8443
# http-server.https.keystore.path=/etc/trino/certs/trino-keystore.jks
# http-server.https.keystore.key={{TRINO_KEYSTORE_PASSWORD}}

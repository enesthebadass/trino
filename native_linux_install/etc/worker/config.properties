# Bu node worker olarak calisir.
coordinator=false

http-server.http.port=8080

# Buraya coordinator'in DNS/IP adresi yazilir.
# Script bu placeholder'i env dosyasindaki TRINO_COORDINATOR_URI ile doldurur.
discovery.uri={{TRINO_COORDINATOR_URI}}

query.max-memory=120GB
query.max-memory-per-node=40GB

# Worker heap 52G oldugu icin native memory/direct buffer/OS icin pay birakiyoruz.
memory.heap-headroom-per-node=8GB
